# Netlify deployment.
#
# The app is deployed to Vercel as well; this is a second target, not a move.
# Everything platform-specific is confined to this file and netlify/functions —
# no application code branches on which host it is running under.
#
# Monorepo: install and build run from the workspace root so @nexus/core and
# @nexus/db resolve; publish points at the Next output inside apps/web, which is
# also how the Next runtime locates the app.

[build]
  command = "npm run build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Declared rather than left to auto-detection: in a workspace the runtime is not
# always picked up, and a Next site served without it degrades to static files.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ── Scheduled jobs ──────────────────────────────────────────────────────────
#
# vercel.json crons do not carry over. Netlify scheduled functions have a
# 30-SECOND execution limit — the automation sweep took 23s in production — so
# these trigger the existing /api/cron/* routes without waiting. The job_runs
# table is the record of what happened, not the HTTP response.
#
# Times are UTC. Gulf Standard Time is UTC+4.
[functions."cron-snapshots"]
  schedule = "50 20 * * *"   # 00:50 GST

[functions."cron-briefing"]
  schedule = "5 2 * * *"     # 06:05 GST

[functions."cron-automation"]
  schedule = "0 4 * * *"     # 08:00 GST

[functions."cron-outbox"]
  schedule = "30 4 * * *"    # 08:30 GST
